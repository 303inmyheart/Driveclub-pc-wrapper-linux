name: Linux AppImage

on:
  push:
    branches: [main, linux-appimage]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: clang-19
      CXX: clang++-19
      BUILD_JOBS: '2'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y \
            build-essential g++-14 clang-19 lld-19 ninja-build git curl pkg-config \
            python3-venv libasound2-dev libpulse-dev libudev-dev libevdev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxtst-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev libdbus-1-dev \
            libegl1-mesa-dev libgl1-mesa-dev libusb-1.0-0-dev uuid-dev libssl-dev \
            patchelf squashfs-tools desktop-file-utils appstream
          python3 -m venv "$RUNNER_TEMP/driveclub-cmake"
          "$RUNNER_TEMP/driveclub-cmake/bin/pip" install cmake==3.31.10
          echo "$RUNNER_TEMP/driveclub-cmake/bin" >> "$GITHUB_PATH"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            echo "VERSION=linux-${GITHUB_SHA:0:8}" >> "$GITHUB_ENV"
          fi

      - name: Initialize Linux dependencies
        run: ./tools/init-linux-submodules.sh

      - name: Test content paths, CPU topology and recorder synchronization
        env:
          CXX: g++-14
        run: |
          ./tools/test-content-paths.sh
          ./tools/test-recorder-wake.sh
          ./tools/test-linux-cpu-topology.sh

      - name: Validate desktop metadata
        run: |
          desktop-file-validate packaging/linux/io.github.driveclub_pc.desktop
          appstreamcli validate --no-net packaging/linux/io.github.driveclub_pc.metainfo.xml

      - name: Build AppImage
        run: |
          mkdir -p .tools
          ./tools/build-appimage.sh \
            -DCMAKE_C_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14 \
            -DCMAKE_CXX_FLAGS=--gcc-install-dir=/usr/lib/gcc/x86_64-linux-gnu/14 \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld 2>&1 | tee .tools/ci-build.log

      - name: Check packaged application
        run: |
          images=(dist/*.AppImage)
          test "${#images[@]}" -eq 1
          APPIMAGE_EXTRACT_AND_RUN=1 DCPC_USER_DIR="$RUNNER_TEMP/driveclub-smoke" \
            "${images[0]}" --help > "$RUNNER_TEMP/driveclub-help.txt"
          grep -q -- '--launcher' "$RUNNER_TEMP/driveclub-help.txt"
          (
            cd dist
            sha256sum --check ./*.sha256
          )
          python3 - <<'PY'
          import os
          import platform
          import subprocess
          from pathlib import Path

          commit = os.environ['GITHUB_SHA']
          repo = os.environ['GITHUB_REPOSITORY']
          compiler = subprocess.check_output(['clang++-19', '--version'], text=True).splitlines()[0]
          info = (
              f'Driveclub-PC native Linux AppImage\n'
              f'Source: https://github.com/{repo}/tree/{commit}\n'
              f'Commit: {commit}\n'
              f'Compiler: {compiler}\n'
              f'Host libc: {platform.libc_ver()}\n'
              'Target: x86_64 / x86-64-v3 (AVX2), Ubuntu 24.04 or compatible\n'
              'Verified: content-path regression tests, metadata, AppImage --help, SHA-256\n'
              'Game execution, DLC gameplay and GPU rendering are not tested by CI.\n'
          )
          Path('dist/BUILD-INFO.txt').write_text(info)
          PY

      - name: Upload AppImage and checksum
        id: appimage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Driveclub-PC-Linux-x86_64-${{ github.sha }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.sha256
            dist/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish GitHub AppImage release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          images=(dist/*.AppImage)
          checksums=(dist/*.AppImage.sha256)
          test "${#images[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          gh release create "$RELEASE_TAG" \
            "${images[0]}" "${checksums[0]}" dist/BUILD-INFO.txt \
            --title "Driveclub-PC $RELEASE_TAG (Linux AppImage)" \
            --notes "Linux x86_64 AppImage (AVX2/Vulkan). Download the AppImage, run chmod +x on it, then execute it. Requires your own game and firmware files; none are included. Built and smoke-tested on Ubuntu 24.04; gameplay is not validated by CI." \
            --verify-tag

      - name: Add download link to summary
        env:
          ARTIFACT_URL: ${{ steps.appimage.outputs.artifact-url }}
        run: |
          printf 'AppImage, SHA-256 and build information: [Download](%s)\n\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          printf 'After extracting the download, run `chmod +x Driveclub-PC-*.AppImage`.\n' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-build-diagnostics-${{ github.sha }}
          path: |
            .tools/ci-build.log
            build/linux-release/CMakeFiles/CMakeConfigureLog.yaml
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
